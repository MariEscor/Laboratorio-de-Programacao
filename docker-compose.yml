services:
  # 1. Banco de Dados Postgres
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env                     # 👈 Atualizado
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env  
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"                 


  # Frontend React
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"     
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend